[package]
name = "knit"
version = "0.1.0"
edition = "2021"
description = "Knit version control system - a from-scratch alternative to Git"
license = "MPL-2.0"

[dependencies]
anyhow = "1.0"
blake3 = "1.5"
clap = { version = "4.5", features = ["derive"] }
crc32fast = "1.4"
dirs = "5.0"
ed25519-dalek = "2.2"
flate2 = "1.1.11"
fs2 = "0.4"
hex = "0.4"
ignore = "0.4"
rand = "0.8"
serde = "1.0"
serde_json = "1.0"
similar = "2"
whoami = "1.4"

[[bin]]
name = "knit"
path = "src/main.rs"

[[bin]]
name = "knits"
path = "src/bin/knits.rs"
